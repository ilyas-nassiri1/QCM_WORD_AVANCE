<style>

:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1c2433;--tx:#e8edf7;--mu:#9aa6bd;--ac:#6a9cf0;--bd:#2c3750}}

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}
.w{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:14px}
h1{margin:0 0 4px;color:var(--ac)}
input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:8px;font-size:16px;margin:6px 0 12px;background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#t.low{color:var(--ko)}
.q b{display:block;margin-bottom:8px}
label{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label:hover{border-color:var(--ac)}
label.ok{background:rgba(26,138,74,.18);border-color:var(--ok)}
label.ko{background:rgba(198,40,40,.15);border-color:var(--ko)}
.hide{display:none}
.score{font-size:42px;font-weight:800;color:var(--ac)}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx);resize:vertical}
.chk{margin-top:8px;padding:8px 14px}
body.pr>*:not(#rep){display:none!important}
body.pr .nop{display:none}
@media print{.bar,.row,#start{display:none}}

</div>

const $=id=>document.getElementById(id);
const TOTAL=90*60;let left=TOTAL,iv=null,done=false,nom='',pre='',note=0,ans={};
const pad=n=>String(n).padStart(2,'0');
function fmt(s){return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}
const nz=t=>(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const good=i=>{const q=Q[i];return q[1]?ans[i]===q[2]:ans[i]&&q[2].every(r=>new RegExp(r).test(nz(ans[i])))};
const upd=()=>$('prog').textContent=Object.keys(ans).length+' / '+Q.length+' réponses';
function reveal(i){document.querySelectorAll('label[data-q="'+i+'"]').forEach(l=>{const o=+l.dataset.o;if(o===Q[i][2])l.classList.add('ok');else if(ans[i]===o)l.classList.add('ko');l.querySelector('input').disabled=true})}
function revealW(i){const t=document.querySelector('textarea[data-w="'+i+'"]');if(!t||t.dataset.r)return;t.dataset.r=1;t.disabled=true;const g=good(i);t.style.borderColor=g?'var(--ok)':'var(--ko)';const b=t.parentNode.querySelector('.chk');if(b)b.remove();t.insertAdjacentHTML('afterend','<div class="mu">'+(g?'✔ Correct : ':'✘ Réponse attendue : ')+Q[i][3]+'</div>')}
function build(){
 $('qs').innerHTML=Q.map((q,i)=>{
  if(!q[1])return `<div class="card q"><b>${i+1}. ✍ ${q[0]}</b><textarea data-w="${i}" rows="2" placeholder="Votre réponse..."></textarea><button class="chk" data-c="${i}">Vérifier</button></div>`;
  const ord=q[1].map((_,j)=>j).sort(()=>Math.random()-.5);
  return `<div class="card q"><b>${i+1}. ${q[0]}</b>`+ord.map(j=>`<label data-q="${i}" data-o="${j}"><input type="radio" name="q${i}" value="${j}"> ${q[1][j]}</label>`).join('')+'</div>'}).join('');
 document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{ans[r.name.slice(1)]=+r.value;upd();reveal(+r.name.slice(1))});
 document.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{const v=t.value.trim();if(v)ans[t.dataset.w]=v;else delete ans[t.dataset.w];upd()});
 document.querySelectorAll('.chk').forEach(b=>b.onclick=()=>revealW(+b.dataset.c));
}
$('go').onclick=()=>{
 nom=$('nom').value.trim();pre=$('pre').value.trim();
 if(!nom||!pre){alert('Veuillez saisir le nom et le prénom.');return}
 $('start').classList.add('hide');$('exam').classList.remove('hide');
 $('who').textContent=pre+' '+nom.toUpperCase();$('prog').textContent='0 / '+Q.length+' réponses';
 build();
 $('t').textContent='Exercice';
};
$('fin').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(!n||confirm(n+' question(s) sans réponse. Terminer quand même ?'))finish(false)};
function finish(auto){
 if(done)return;done=true;clearInterval(iv);
 note=Q.reduce((s,q,i)=>s+(good(i)?1:0),0);
 document.querySelectorAll('input,textarea').forEach(i=>i.disabled=true);
 $('exam').classList.add('hide');$('res').classList.remove('hide');
 $('rwho').innerHTML='<b>'+pre+' '+nom.toUpperCase()+'</b>';
 $('sc').textContent=note+' / '+Q.length;
 $('msg').textContent=(note>=Q.length/2?'Réussi':'Non réussi');
 window.scrollTo(0,0);
}
$('rev').onclick=()=>{
 $('exam').classList.remove('hide');document.querySelector('.bar').classList.add('hide');$('fin').classList.add('hide');
 document.querySelectorAll('label[data-q]').forEach(l=>{const q=+l.dataset.q,o=+l.dataset.o;
  if(o===Q[q][2])l.classList.add('ok');else if(ans[q]===o)l.classList.add('ko');
  const r=l.querySelector('input');r.checked=ans[q]===o});
 document.querySelectorAll('textarea').forEach(t=>revealW(+t.dataset.w));
 $('exam').scrollIntoView();
};
$('pdf').onclick=async()=>{
 const {jsPDF}=window.jspdf||{};
 if(!jsPDF){window.print();return}
 const d=new jsPDF({unit:'mm',format:'a4'});let y=20;
 d.setFontSize(20);d.text('Exercice Microsoft Word - Résultat',105,y,{align:'center'});y+=14;
 d.setFontSize(13);d.text('Nom : '+nom.toUpperCase(),20,y);y+=8;d.text('Prénom : '+pre,20,y);y+=8;
 d.text('Date : '+new Date().toLocaleString('fr-FR'),20,y);y+=8;
 y+=6;
 d.setFontSize(26);d.text('Note : '+note+' / '+Q.length,20,y);y+=8;
 d.setFontSize(13);d.text('Soit '+(note/Q.length*20).toFixed(1)+' / 20  -  '+(note>=Q.length/2?'Réussi':'Non réussi'),20,y);y+=14;
 d.setFontSize(10);
 Q.forEach((q,i)=>{if(y>275){d.addPage();y=20}
  const ok=!!good(i);const a=ans[i]===undefined?'(sans réponse)':(q[1]?q[1][ans[i]]:ans[i]);
  const t=d.splitTextToSize((i+1)+'. '+(ok?'[OK] ':'[X] ')+q[0]+'  Réponse : '+a+(ok?'':'  | Correct : '+(q[1]?q[1][q[2]]:q[3])),170);
  d.text(t,20,y);y+=t.length*5+2});
 const fn=('Exercice-Word_'+nom+'_'+pre+'.pdf').replace(/\s+/g,'_'),st=$('info');
 try{d.save(fn);st.textContent='PDF téléchargé.';return}
 catch(e){st.textContent='Téléchargement impossible : utilisez la version imprimable ci-dessous.'}
 printable();
};
function printable(){
